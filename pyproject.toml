[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structcodec"
version = "0.1.0"
readme = "README.md"
description = "StructCodec implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "torch>=2.2", "torchvision>=0.17", "pillow>=10", "gudhi>=3.9"]

[tool.setuptools.packages.find]
include = ["structcodec*"]

[project.optional-dependencies]
evaluation = ["transformers>=4.40", "torchmetrics>=1.3", "pycocotools>=2.0.7"]
